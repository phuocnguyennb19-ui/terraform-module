# ==============================================================================
# DEV ENVIRONMENT
# ==============================================================================
# This one file is read by the root composition AND by every module: each module
# resolves file("${path.cwd}/${var.config_file}") and picks out its own block.
# Run Terraform from the repository root so that path stays valid.
#
#   make plan ENV=dev
#
# Every key below appears in the module's locals.tf. Keys not listed fall back to
# the module's own defaults — see modules/<name>/locals.tf for the full set.
# `enabled` is read by the ROOT only (it becomes a count gate); no module has an
# internal enabled flag.
# ==============================================================================

global:
  environment: "dev"
  region: "ap-southeast-1"
  project: "SM-Platform"
  aws_profile: "personal-dev"
  managed_by: "DylanDevOps"
  cost_center: "engineering"
  tags:
    Owner: "platform-team"
    DataClass: "internal"

# Feeds name_prefix = <env>-<app_name>-<service_type>, with app_name omitted when
# it is "base". Here that yields: dev-infra
app_name: "base"
service_type: "infra"

# ---- FOUNDATION --------------------------------------------------------------

vpc:
  enabled: true
  cidr: "10.10.0.0/16"
  azs:
    - "ap-southeast-1a"
    - "ap-southeast-1b"
    - "ap-southeast-1c"
  public_subnets:
    - "10.10.0.0/20"
    - "10.10.16.0/20"
    - "10.10.32.0/20"
  private_subnets:
    - "10.10.64.0/19"
    - "10.10.96.0/19"
    - "10.10.128.0/19"
  database_subnets:
    - "10.10.160.0/24"
    - "10.10.161.0/24"
    - "10.10.162.0/24"
  enable_nat_gateway: true
  single_nat_gateway: true          # one NAT for all AZs — dev economy
  one_nat_gateway_per_az: false
  enable_dns_hostnames: true
  enable_dns_support: true
  create_database_subnet_group: true
  enable_flow_log: false            # off in dev; on in prod
  public_subnet_tags:
    Tier: "Public"
  private_subnet_tags:
    Tier: "Private"

kms:
  enabled: true
  description: "Master key for dev-infra"
  deletion_window_in_days: 7        # shortest allowed — dev is disposable
  rotation_period_in_days: 365
  multi_region: false

iam:
  enabled: true
  roles:
    ecs_task_execution:
      trusted_role_services:
        - "ecs-tasks.amazonaws.com"
      custom_role_policy_arns:
        - "arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy"

# ---- PRIMITIVES --------------------------------------------------------------

security_group:
  enabled: true
  description: "Shared application security group (dev)"
  ingress_with_cidr_blocks:
    - from_port: 443
      to_port: 443
      protocol: "tcp"
      description: "HTTPS from inside the VPC"
      cidr_blocks: "10.10.0.0/16"
  egress_rules:
    - "all-all"
  egress_cidr_blocks:
    - "0.0.0.0/0"

ecr:
  enabled: true
  repository_names:
    - "core-backend-api"
    - "core-frontend-web"
  image_tag_mutability: "MUTABLE"   # IMMUTABLE in prod
  scan_on_push: true
  encryption_type: "AES256"

s3:
  enabled: true
  bucket: "sm-platform-dev-artifacts"
  versioning_enabled: true
  block_public_acls: true
  block_public_policy: true
  force_destroy: true               # dev only — never true in prod

cloudwatch:
  enabled: true
  log_groups:
    app:
      name: "/ecs/dev-infra"
      retention_in_days: 7
  metric_alarms:
    ecs_cpu_high:
      alarm_name: "dev-infra-ecs-cpu-high"
      alarm_description: "ECS service CPU above 80% for 5 minutes"
      namespace: "AWS/ECS"
      metric_name: "CPUUtilization"
      statistic: "Average"
      comparison_operator: "GreaterThanOrEqualToThreshold"
      threshold: 80
      period: 60
      evaluation_periods: 5
      treat_missing_data: "notBreaching"
      # No module-to-module edge exists from sns to cloudwatch: paste the ARN
      # from `terraform output sns_topic_arns` here. See CLAUDE.md defect #3.
      alarm_actions: []

sns:
  enabled: true
  topics:
    alerts:
      name: "dev-infra-alerts"

# ---- EDGE & DATA -------------------------------------------------------------
# Present with real keys, switched off. Flip enabled to true to build them.

acm:
  enabled: false

dns:
  enabled: false

waf:
  enabled: false

alb:
  enabled: false
  internal: false
  idle_timeout: 60
  enable_deletion_protection: false

rds:
  enabled: false
  engine: "postgres"
  engine_version: "16.3"
  major_engine_version: "16"
  family: "postgres16"
  instance_class: "db.t4g.micro"
  allocated_storage: 20
  multi_az: false
  backup_retention_period: 1
  deletion_protection: false
  skip_final_snapshot: true
  performance_insights_enabled: false
  monitoring_interval: 0

elasticache:
  enabled: false
  engine: "redis"
  engine_version: "7.1"
  node_type: "cache.t4g.micro"
  num_cache_nodes: 1
  automatic_failover_enabled: false
  multi_az_enabled: false

dynamodb:
  enabled: false

sqs:
  enabled: false

secrets_manager:
  enabled: false

# ---- COMPUTE -----------------------------------------------------------------

ecs:
  enabled: false
  container_insights: false
  fargate_weight: 0
  fargate_spot_weight: 100          # dev runs entirely on spot

service:
  enabled: false
  desired_count: 1
  health_check_path: "/healthz"
  health_check_matcher: "200"
  enable_execute_command: true      # dev debugging
  assign_public_ip: false
  task_definition:
    cpu: 256
    memory: 512
  container_definitions:
    - name: "app"
      image: "public.ecr.aws/nginx/nginx:stable"
      essential: true
      port_mappings:
        - container_port: 8080
          protocol: "tcp"

autoscaling:
  enabled: false
  min_capacity: 1
  max_capacity: 3
  target_cpu_utilization: 70
  target_memory_utilization: 0

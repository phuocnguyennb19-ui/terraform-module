# STAGING ENVIRONMENT — production rehearsal
# Same keys as prod, smaller numbers. If a key exists in prod/config.yml and not
# here, staging has stopped rehearsing production. Keep the two files structurally
# identical and let only the values differ.
#
#   make plan ENV=staging

global:
  environment: "staging"
  region: "ap-southeast-1"
  project: "SM-Platform"
  aws_profile: "personal-staging"
  managed_by: "DylanDevOps"
  cost_center: "engineering"
  tags:
    Owner: "platform-team"
    DataClass: "internal"

app_name: "base"
service_type: "infra"

vpc:
  enabled: true
  cidr: "10.20.0.0/16"
  azs: ["ap-southeast-1a", "ap-southeast-1b", "ap-southeast-1c"]
  public_subnets: ["10.20.0.0/20", "10.20.16.0/20", "10.20.32.0/20"]
  private_subnets: ["10.20.64.0/19", "10.20.96.0/19", "10.20.128.0/19"]
  database_subnets: ["10.20.160.0/24", "10.20.161.0/24", "10.20.162.0/24"]
  enable_nat_gateway: true
  single_nat_gateway: true
  one_nat_gateway_per_az: false
  enable_dns_hostnames: true
  enable_dns_support: true
  create_database_subnet_group: true
  enable_flow_log: true
  flow_log_traffic_type: "REJECT"

kms:
  enabled: true
  description: "Master key for staging-infra"
  deletion_window_in_days: 30
  rotation_period_in_days: 365
  multi_region: false

iam:
  enabled: true
  roles:
    ecs_task_execution:
      trusted_role_services: ["ecs-tasks.amazonaws.com"]
      custom_role_policy_arns:
        - "arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy"

security_group:
  enabled: true
  description: "Shared application security group (staging)"
  ingress_with_cidr_blocks:
    - from_port: 443
      to_port: 443
      protocol: "tcp"
      description: "HTTPS from inside the VPC"
      cidr_blocks: "10.20.0.0/16"
  egress_rules: ["all-all"]
  egress_cidr_blocks: ["0.0.0.0/0"]

ecr:
  enabled: false                    # images are promoted from dev, not rebuilt

s3:
  enabled: true
  bucket: "sm-platform-staging-artifacts"
  versioning_enabled: true
  block_public_acls: true
  block_public_policy: true
  force_destroy: false

cloudwatch:
  enabled: true
  log_groups:
    app:
      name: "/ecs/staging-infra"
      retention_in_days: 30
  metric_alarms:
    ecs_cpu_high:
      alarm_name: "staging-infra-ecs-cpu-high"
      alarm_description: "ECS service CPU above 80% for 5 minutes"
      namespace: "AWS/ECS"
      metric_name: "CPUUtilization"
      statistic: "Average"
      comparison_operator: "GreaterThanOrEqualToThreshold"
      threshold: 80
      period: 60
      evaluation_periods: 5
      treat_missing_data: "notBreaching"
      alarm_actions: []             # paste the SNS topic ARN — see CLAUDE.md #3

sns:
  enabled: true
  topics:
    alerts:
      name: "staging-infra-alerts"

acm:
  enabled: false
dns:
  enabled: false
waf:
  enabled: false

alb:
  enabled: false
  internal: false
  idle_timeout: 60
  enable_deletion_protection: false

rds:
  enabled: false
  engine: "postgres"
  engine_version: "16.3"
  major_engine_version: "16"
  family: "postgres16"
  instance_class: "db.t4g.small"
  allocated_storage: 50
  multi_az: false
  backup_retention_period: 7
  deletion_protection: false
  skip_final_snapshot: false
  performance_insights_enabled: true
  monitoring_interval: 60

elasticache:
  enabled: false
  engine: "redis"
  engine_version: "7.1"
  node_type: "cache.t4g.small"
  num_cache_nodes: 1
  automatic_failover_enabled: false
  multi_az_enabled: false

dynamodb:
  enabled: false
sqs:
  enabled: false
secrets_manager:
  enabled: false

ecs:
  enabled: false
  container_insights: true
  fargate_weight: 50
  fargate_spot_weight: 50

service:
  enabled: false
  desired_count: 2
  health_check_path: "/healthz"
  health_check_matcher: "200"
  enable_execute_command: false
  assign_public_ip: false
  task_definition:
    cpu: 512
    memory: 1024
  container_definitions:
    - name: "app"
      image: "public.ecr.aws/nginx/nginx:stable"
      essential: true
      port_mappings:
        - container_port: 8080
          protocol: "tcp"

autoscaling:
  enabled: false
  min_capacity: 2
  max_capacity: 6
  target_cpu_utilization: 70
  target_memory_utilization: 0

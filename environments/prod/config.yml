# PRODUCTION ENVIRONMENT
# Structurally identical to staging/config.yml. Only the values differ.
#
#   make plan ENV=prod       # plan is read-only and safe
#   make apply ENV=prod      # requires an explicit approval — see Makefile

global:
  environment: "prod"
  region: "ap-southeast-1"
  project: "SM-Platform"
  aws_profile: "personal-prod"
  managed_by: "DylanDevOps"
  cost_center: "production"
  tags:
    Owner: "platform-team"
    DataClass: "confidential"

app_name: "base"
service_type: "infra"

vpc:
  enabled: true
  cidr: "10.30.0.0/16"
  azs: ["ap-southeast-1a", "ap-southeast-1b", "ap-southeast-1c"]
  public_subnets: ["10.30.0.0/20", "10.30.16.0/20", "10.30.32.0/20"]
  private_subnets: ["10.30.64.0/19", "10.30.96.0/19", "10.30.128.0/19"]
  database_subnets: ["10.30.160.0/24", "10.30.161.0/24", "10.30.162.0/24"]
  enable_nat_gateway: true
  single_nat_gateway: false         # a single NAT is a single AZ failure domain
  one_nat_gateway_per_az: true
  enable_dns_hostnames: true
  enable_dns_support: true
  create_database_subnet_group: true
  enable_flow_log: true
  flow_log_traffic_type: "ALL"
  flow_log_max_aggregation_interval: 60

kms:
  enabled: true
  description: "Master key for prod-infra"
  deletion_window_in_days: 30
  rotation_period_in_days: 365
  multi_region: false

iam:
  enabled: true
  roles:
    ecs_task_execution:
      trusted_role_services: ["ecs-tasks.amazonaws.com"]
      custom_role_policy_arns:
        - "arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy"

security_group:
  enabled: true
  description: "Shared application security group (prod)"
  ingress_with_cidr_blocks:
    - from_port: 443
      to_port: 443
      protocol: "tcp"
      description: "HTTPS from inside the VPC"
      cidr_blocks: "10.30.0.0/16"
  egress_rules: ["https-443-tcp"]   # not all-all: prod egress is constrained
  egress_cidr_blocks: ["0.0.0.0/0"]

ecr:
  enabled: false

s3:
  enabled: true
  bucket: "sm-platform-prod-artifacts"
  versioning_enabled: true
  block_public_acls: true
  block_public_policy: true
  force_destroy: false              # must stay false

cloudwatch:
  enabled: true
  log_groups:
    app:
      name: "/ecs/prod-infra"
      retention_in_days: 90
  metric_alarms:
    ecs_cpu_high:
      alarm_name: "prod-infra-ecs-cpu-high"
      alarm_description: "ECS service CPU above 80% for 5 minutes"
      namespace: "AWS/ECS"
      metric_name: "CPUUtilization"
      statistic: "Average"
      comparison_operator: "GreaterThanOrEqualToThreshold"
      threshold: 80
      period: 60
      evaluation_periods: 5
      treat_missing_data: "notBreaching"
      alarm_actions: []             # MUST be filled in prod — see CLAUDE.md #3

sns:
  enabled: true
  topics:
    alerts:
      name: "prod-infra-alerts"

acm:
  enabled: false
dns:
  enabled: false
waf:
  enabled: false

alb:
  enabled: false
  internal: false
  idle_timeout: 60
  enable_deletion_protection: true

rds:
  enabled: false
  engine: "postgres"
  engine_version: "16.3"
  major_engine_version: "16"
  family: "postgres16"
  instance_class: "db.m6g.large"
  allocated_storage: 100
  max_allocated_storage: 500
  multi_az: true
  backup_retention_period: 30
  deletion_protection: true
  skip_final_snapshot: false
  performance_insights_enabled: true
  monitoring_interval: 60
  iam_database_authentication_enabled: true

elasticache:
  enabled: false
  engine: "redis"
  engine_version: "7.1"
  node_type: "cache.m6g.large"
  automatic_failover_enabled: true
  multi_az_enabled: true
  num_node_groups: 1
  replicas_per_node_group: 2
  snapshot_retention_limit: 7

dynamodb:
  enabled: false
sqs:
  enabled: false
secrets_manager:
  enabled: false

ecs:
  enabled: false
  container_insights: true
  fargate_weight: 100
  fargate_spot_weight: 0            # no spot in prod

service:
  enabled: false
  desired_count: 3
  health_check_path: "/healthz"
  health_check_matcher: "200"
  enable_execute_command: false
  assign_public_ip: false
  wait_for_steady_state: true
  task_definition:
    cpu: 1024
    memory: 2048
  container_definitions:
    - name: "app"
      image: "public.ecr.aws/nginx/nginx:stable"
      essential: true
      port_mappings:
        - container_port: 8080
          protocol: "tcp"

autoscaling:
  enabled: false
  min_capacity: 3
  max_capacity: 12
  target_cpu_utilization: 60
  target_memory_utilization: 70

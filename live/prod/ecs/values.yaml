# ════════════════════════════════════════════════════════════════════
# REQUIRED
# ════════════════════════════════════════════════════════════════════
app_name:        "api-service"
environment:     "prod"
container_image: "123456789012.dkr.ecr.ap-southeast-1.amazonaws.com/api-service:v1.0"

# ════════════════════════════════════════════════════════════════════
# CAPACITY  (FARGATE | FARGATE_SPOT | MIXED | EC2)
# ════════════════════════════════════════════════════════════════════
capacity_type: "MIXED"

# ════════════════════════════════════════════════════════════════════
# CONTAINER
# ════════════════════════════════════════════════════════════════════
container_port: 8080
cpu:            512
memory:         1024
desired_count:  3

environment_vars:
  APP_ENV:   "production"
  LOG_LEVEL: "info"

# secrets_vars:  # optional - SSM/Secrets Manager ARN
#   DB_PASSWORD: "arn:aws:ssm:ap-southeast-1:123456789012:parameter/prod/db_password"

# ════════════════════════════════════════════════════════════════════
# DEPLOYMENT  (optional - defaults shown)
# ════════════════════════════════════════════════════════════════════
force_new_deployment:               true
health_check_grace_period_seconds:  60
enable_execute_command:             false
deployment_maximum_percent:         200
deployment_minimum_healthy_percent: 66

# ════════════════════════════════════════════════════════════════════
# AUTOSCALING  (optional - defaults shown)
# ════════════════════════════════════════════════════════════════════
autoscaling_min_capacity:  2
autoscaling_max_capacity:  10
autoscaling_cpu_target:    70
autoscaling_memory_target: 80
scale_in_cooldown:         300
scale_out_cooldown:        60

# ════════════════════════════════════════════════════════════════════
# OBSERVABILITY  (optional - defaults shown)
# ════════════════════════════════════════════════════════════════════
container_insights: true
log_retention_days: 90

tags:
  Project:   "devops"
  ManagedBy: "terragrunt"

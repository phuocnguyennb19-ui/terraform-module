# ==============================================================================
# s3 — config reference
# ==============================================================================
# Read by modules/s3/locals.tf. Every key below appears in that file; anything
# you omit falls back to the module's own default.
#
# `enabled` is read by the ROOT and becomes a count gate (README §4.4).
#
# Used as an overlay in directory mode:
#   terraform plan -var="config_dir=examples/modules"
# or paste this block into a monolithic config.yml.
# ==============================================================================

s3:
  enabled: false
  bucket: "sm-platform-dev-artifacts"
  versioning_enabled: true
  kms_key_id: null                               # null = SSE-S3; an ARN = SSE-KMS
  block_public_acls: true
  block_public_policy: true
  force_destroy: false                           # true ONLY in dev
  object_lock_enabled: false
  object_lock_configuration: {}
  acceleration_status: null
  lifecycle_rule:
    - id: "expire-old-artifacts"
      enabled: true
      expiration: { days: 90 }
      noncurrent_version_expiration: { days: 30 }
  cors_rule: []
  logging:
    target_bucket: "sm-platform-dev-logs"
    target_prefix: "s3/"
  website: {}
  intelligent_tiering: {}
  metric_configuration: []
  replication_configuration: {}

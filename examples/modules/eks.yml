# ==============================================================================
# eks — config reference
# ==============================================================================
# Read by modules/eks/locals.tf. Every key below appears in that file; anything
# you omit falls back to the module's own default.
#
# `enabled` is read by the ROOT and becomes a count gate (README §4.4).
#
# Needs `vpc_id`, `private_subnets`, `public_subnets` from the root.
# For EKS to place load balancers, the VPC subnets need the standard tags:
#   public:  kubernetes.io/role/elb: "1"
#   private: kubernetes.io/role/internal-elb: "1"
#
# Used as an overlay in directory mode:
#   terraform plan -var="config_dir=examples/modules"
# or paste this block into a monolithic config.yml.
# ==============================================================================

eks:
  enabled: false
  cluster_name: "dev-infra-eks"
  cluster_version: "1.31"

  # Private by default. A public API server open to 0.0.0.0/0 is the single most
  # common EKS misconfiguration; if you must open it, list office CIDRs here.
  endpoint_private_access: true
  endpoint_public_access: false
  public_access_cidrs: []

  enabled_log_types: ["api", "audit"]          # prod: all five
  authentication_mode: "API"                   # access entries, not aws-auth
  enable_cluster_creator_admin_permissions: true
  enable_irsa: true                            # OIDC provider, for pod IAM roles

  create_kms_key: true                         # envelope-encrypts Kubernetes secrets
  kms_key_arn: null                            # set to reuse an existing key
  cluster_encryption_config: { resources: ["secrets"] }

  create_cloudwatch_log_group: true
  cloudwatch_log_group_retention_in_days: 30

  subnet_ids: []                               # empty = the private_subnets wired in

  access_entries:
    platform_admins:
      principal_arn: "arn:aws:iam::111122223333:role/platform-admin"
      policy_associations:
        admin:
          policy_arn: "arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy"
          access_scope: { type: "cluster" }

  addons:
    coredns: {}
    kube-proxy: {}
    vpc-cni: { before_compute: true }          # must exist before nodes join
    eks-pod-identity-agent: {}

  node_group_defaults:
    ami_type: "AL2023_x86_64_STANDARD"
    disk_size: 50

  node_groups:
    default:
      min_size: 2
      max_size: 6
      desired_size: 2
      instance_types: ["t3.large"]
      capacity_type: "SPOT"                    # ON_DEMAND in prod
      labels: { workload: "general" }

  fargate_profiles: {}
  security_group_additional_rules: {}
  node_security_group_additional_rules: {}

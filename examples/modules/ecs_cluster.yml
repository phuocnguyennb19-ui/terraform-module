# ==============================================================================
# ecs_cluster — config reference
# ==============================================================================
# Read by modules/ecs_cluster/locals.tf. Every key below appears in that file; anything
# you omit falls back to the module's own default.
#
# `enabled` is read by the ROOT and becomes a count gate (README §4.4).
#
# Block is `ecs`. Legacy key `ecs_cluster` is still merged.
#
# Used as an overlay in directory mode:
#   terraform plan -var="config_dir=examples/modules"
# or paste this block into a monolithic config.yml.
# ==============================================================================

ecs:                                             # legacy key: ecs_cluster
  enabled: false
  container_insights: true
  kms_key_id: null                               # encrypts ECS Exec sessions
  fargate_weight: 100                            # prod: all on-demand
  fargate_base: 0
  fargate_spot_weight: 0                         # dev: 0 / 100 for all-spot
  create_task_exec_iam_role: true
  create_task_exec_policy: true
  task_exec_secret_arns:    ["arn:aws:secretsmanager:ap-southeast-1:111122223333:secret:*"]
  task_exec_ssm_param_arns: []

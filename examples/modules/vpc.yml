# ==============================================================================
# vpc — config reference
# ==============================================================================
# Read by modules/vpc/locals.tf. Every key below appears in that file; anything
# you omit falls back to the module's own default.
#
# `enabled` is read by the ROOT and becomes a count gate (README §4.4).
#
# Used as an overlay in directory mode:
#   terraform plan -var="config_dir=examples/modules"
# or paste this block into a monolithic config.yml.
# ==============================================================================

vpc:
  enabled: false
  cidr: "10.10.0.0/16"
  azs: ["ap-southeast-1a", "ap-southeast-1b", "ap-southeast-1c"]
  public_subnets:   ["10.10.0.0/20",   "10.10.16.0/20",  "10.10.32.0/20"]
  private_subnets:  ["10.10.64.0/19",  "10.10.96.0/19",  "10.10.128.0/19"]
  database_subnets: ["10.10.160.0/24", "10.10.161.0/24", "10.10.162.0/24"]
  intra_subnets: []                   # no route to the internet at all
  enable_nat_gateway: true
  single_nat_gateway: true            # prod: false, with one_nat_gateway_per_az true
  one_nat_gateway_per_az: false
  enable_dns_hostnames: true
  enable_dns_support: true
  enable_vpn_gateway: false
  create_database_subnet_group: true
  create_database_subnet_route_table: false
  enable_flow_log: true
  flow_log_traffic_type: "REJECT"     # ALL | ACCEPT | REJECT
  flow_log_max_aggregation_interval: 60
  public_subnet_tags:   { Tier: "Public" }
  private_subnet_tags:  { Tier: "Private" }
  database_subnet_tags: { Tier: "Data" }
  intra_subnet_tags:    {}

# ==============================================================================
# dynamodb — config reference
# ==============================================================================
# Read by modules/dynamodb/locals.tf. Every key below appears in that file; anything
# you omit falls back to the module's own default.
#
# `enabled` is read by the ROOT and becomes a count gate (README §4.4).
#
# Used as an overlay in directory mode:
#   terraform plan -var="config_dir=examples/modules"
# or paste this block into a monolithic config.yml.
# ==============================================================================

dynamodb:
  enabled: false
  tables:
    sessions:
      name: "dev-infra-sessions"
      billing_mode: "PAY_PER_REQUEST"            # or PROVISIONED + read/write_capacity
      hash_key:  "pk"
      range_key: "sk"
      attributes:
        - { name: "pk", type: "S" }
        - { name: "sk", type: "S" }
      ttl_attribute_name: "expires_at"
      point_in_time_recovery_enabled: true
      deletion_protection_enabled: true
      server_side_encryption_enabled: true
      kms_key_arn: null
      stream_enabled: true
      stream_view_type: "NEW_AND_OLD_IMAGES"
      global_secondary_indexes: []
      local_secondary_indexes: []

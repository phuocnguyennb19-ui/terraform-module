# ==============================================================================
# cloudwatch — config reference
# ==============================================================================
# Read by modules/cloudwatch/locals.tf. Every key below appears in that file; anything
# you omit falls back to the module's own default.
#
# `enabled` is read by the ROOT and becomes a count gate (README §4.4).
#
# Used as an overlay in directory mode:
#   terraform plan -var="config_dir=examples/modules"
# or paste this block into a monolithic config.yml.
# ==============================================================================

cloudwatch:
  enabled: false
  log_groups:
    app:
      name: "/ecs/dev-infra"
      retention_in_days: 30
      kms_key_id: null
  metric_alarms:
    ecs_cpu_high:
      alarm_name: "dev-infra-ecs-cpu-high"
      alarm_description: "ECS service CPU above 80% for 5 minutes"
      namespace: "AWS/ECS"
      metric_name: "CPUUtilization"
      statistic: "Average"
      comparison_operator: "GreaterThanOrEqualToThreshold"
      threshold: 80
      period: 60
      evaluation_periods: 5
      treat_missing_data: "notBreaching"
      dimensions:
        ClusterName: "dev-infra-cluster"
        ServiceName: "dev-infra"
      # No module-to-module wiring exists (README §8.3). Paste the ARN from
      # `terraform output sns_topic_arns`. Empty means the alarm notifies nobody.
      alarm_actions: ["arn:aws:sns:ap-southeast-1:111122223333:dev-infra-alerts"]
      ok_actions: []
      insufficient_data_actions: []
  dashboards:
    overview:
      name: "dev-infra-overview"
      body: |
        { "widgets": [] }

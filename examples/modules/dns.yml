# ==============================================================================
# dns — config reference
# ==============================================================================
# Read by modules/dns/locals.tf. Every key below appears in that file; anything
# you omit falls back to the module's own default.
#
# `enabled` is read by the ROOT and becomes a count gate (README §4.4).
#
# Block is `dns`. Legacy key `route53` is still merged.
# A record may use `alias: { target: "alb" }`; the root wires the ALB outputs in.
#
# Used as an overlay in directory mode:
#   terraform plan -var="config_dir=examples/modules"
# or paste this block into a monolithic config.yml.
# ==============================================================================

dns:                                             # legacy key: route53
  enabled: false
  zones:
    "dev.platform.example.com":
      comment: "Dev platform zone"
  records:                                       # keyed by ZONE NAME
    "dev.platform.example.com":
      - name: "api"
        type: "A"
        alias:
          name:    "dualstack.dev-alb-123456.ap-southeast-1.elb.amazonaws.com"
          zone_id: "Z1LMS91P8CMLE5"
      - name: ""
        type: "TXT"
        ttl: 300
        records: ["v=spf1 -all"]

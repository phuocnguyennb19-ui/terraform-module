# ==============================================================================
# acm — config reference
# ==============================================================================
# Read by modules/acm/locals.tf. Every key below appears in that file; anything
# you omit falls back to the module's own default.
#
# `enabled` is read by the ROOT and becomes a count gate (README §4.4).
#
# Used as an overlay in directory mode:
#   terraform plan -var="config_dir=examples/modules"
# or paste this block into a monolithic config.yml.
# ==============================================================================

acm:
  enabled: false
  domain_name: "dev.platform.example.com"
  subject_alternative_names: ["*.dev.platform.example.com"]
  validation_method: "DNS"                       # DNS | EMAIL
  wait_for_validation: true                      # false in CI so apply does not block
  key_algorithm: "RSA_2048"
  certificate_transparency_logging_preference: "ENABLED"

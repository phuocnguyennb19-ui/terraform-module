# secrets_manager — config reference
# Read by modules/secrets_manager/locals.tf. Every key below appears in that file; anything
# you omit falls back to the module's own default.
#
# `enabled` is read by the ROOT and becomes a count gate.
#
# Used as an overlay in directory mode:
#   terraform plan -var="config_dir=examples/module-config"
# or paste this block into a monolithic config.yml.

secrets_manager:
  enabled: false
  # Create the secret here; set its VALUE out of band and reference it by ARN.
  # Never put a secret value in this file.
  secrets:
    db_password:
      description: "Application database password"
      kms_key_id: null
      recovery_window_in_days: 30                # 0 deletes immediately — dev only
      ignore_secret_changes: true                # rotation happens outside Terraform
      rotation_lambda_arn: null
      rotation_rules: {}

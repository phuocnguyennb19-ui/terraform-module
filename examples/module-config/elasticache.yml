# elasticache — config reference
# Read by modules/elasticache/locals.tf. Every key below appears in that file; anything
# you omit falls back to the module's own default.
#
# `enabled` is read by the ROOT and becomes a count gate.
#
# Needs `vpc_id` and `private_subnets` from the root.
#
# Used as an overlay in directory mode:
#   terraform plan -var="config_dir=examples/module-config"
# or paste this block into a monolithic config.yml.

elasticache:
  enabled: false
  engine: "redis"
  engine_version: "7.1"
  node_type: "cache.t4g.micro"
  num_cache_nodes: 1
  num_node_groups: 1                             # shards, for cluster mode
  replicas_per_node_group: 2                     # prod
  port: 6379
  parameter_group_name: "default.redis7"
  automatic_failover_enabled: true               # requires at least one replica
  multi_az_enabled: true
  snapshot_retention_limit: 7                    # 0 disables snapshots
  snapshot_window: "03:00-05:00"
  maintenance_window: "sun:05:00-sun:07:00"
  apply_immediately: false
  auto_minor_version_upgrade: true
  kms_key_arn: null
  security_group_ids: []                         # empty = the module creates one

  # Additional upstream arguments — 41 keys, grouped by concern.
  # All commented out: the value shown is the upstream default that applies
  # when the key is absent. Uncomment to change one.


# ecr — config reference
# Read by modules/ecr/locals.tf. Every key below appears in that file; anything
# you omit falls back to the module's own default.
#
# `enabled` is read by the ROOT and becomes a count gate.
#
# Used as an overlay in directory mode:
#   terraform plan -var="config_dir=examples/module-config"
# or paste this block into a monolithic config.yml.

ecr:
  enabled: false
  repository_names: ["core-backend-api", "core-frontend-web"]
  image_tag_mutability: "IMMUTABLE"              # MUTABLE in dev
  scan_on_push: true
  encryption_type: "AES256"                      # or KMS, with kms_key set
  kms_key: null
  repository_force_delete: false
  read_access_arns:       ["arn:aws:iam::111122223333:role/dev-infra-ecs-task"]
  read_write_access_arns: ["arn:aws:iam::111122223333:role/ci-deployer"]
  lifecycle_policy: |
    {
      "rules": [{
        "rulePriority": 1,
        "description": "Keep the last 30 images",
        "selection": { "tagStatus": "any", "countType": "imageCountMoreThan", "countNumber": 30 },
        "action": { "type": "expire" }
      }]
    }

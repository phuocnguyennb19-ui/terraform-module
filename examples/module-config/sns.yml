# sns — config reference
# Read by modules/sns/locals.tf. Every key below appears in that file; anything
# you omit falls back to the module's own default.
#
# `enabled` is read by the ROOT and becomes a count gate.
#
# Used as an overlay in directory mode:
#   terraform plan -var="config_dir=examples/module-config"
# or paste this block into a monolithic config.yml.

sns:
  enabled: false
  topics:
    alerts:
      name: "dev-infra-alerts"
      display_name: "Dev infra alerts"
      fifo_topic: false
      content_based_deduplication: false
      kms_master_key_id: null
      delivery_policy: null
      subscriptions:
        oncall_email:
          protocol: "email"
          endpoint: "oncall@example.com"
      lambda_feedback: {}                        # v6.1.1 shape
      sqs_feedback: {}

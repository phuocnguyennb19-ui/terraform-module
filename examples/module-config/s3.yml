# s3 — config reference
# Read by modules/s3/locals.tf. Every key below appears in that file; anything
# you omit falls back to the module's own default.
#
# `enabled` is read by the ROOT and becomes a count gate.
#
# Used as an overlay in directory mode:
#   terraform plan -var="config_dir=examples/module-config"
# or paste this block into a monolithic config.yml.

s3:
  enabled: false
  bucket: "sm-platform-dev-artifacts"
  versioning_enabled: true
  kms_key_id: null                               # null = SSE-S3; an ARN = SSE-KMS
  block_public_acls: true
  block_public_policy: true
  force_destroy: false                           # true ONLY in dev
  object_lock_enabled: false
  object_lock_configuration: {}
  acceleration_status: null
  lifecycle_rule:
    - id: "expire-old-artifacts"
      enabled: true
      expiration: { days: 90 }
      noncurrent_version_expiration: { days: 30 }
  cors_rule: []
  logging:
    target_bucket: "sm-platform-dev-logs"
    target_prefix: "s3/"
  website: {}
  intelligent_tiering: {}
  metric_configuration: []
  replication_configuration: {}

  # Additional upstream arguments — 32 keys, grouped by concern.
  # All commented out: the value shown is the upstream default that applies
  # when the key is absent. Uncomment to change one.

  # access
  # access_log_delivery_policy_source_accounts: []
  # access_log_delivery_policy_source_buckets: []

  # analytics
  # analytics_configuration: {}
  # analytics_self_source_destination: false
  # analytics_source_account_id: null
  # analytics_source_bucket_arn: null

  # attach
  # attach_access_log_delivery_policy: false

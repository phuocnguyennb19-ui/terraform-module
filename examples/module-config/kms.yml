# kms — config reference
# Read by modules/kms/locals.tf. Every key below appears in that file; anything
# you omit falls back to the module's own default.
#
# `enabled` is read by the ROOT and becomes a count gate.
#
# Used as an overlay in directory mode:
#   terraform plan -var="config_dir=examples/module-config"
# or paste this block into a monolithic config.yml.

kms:
  enabled: false
  description: "Master key for dev-infra"
  aliases: ["alias/dev-infra-key"]
  deletion_window_in_days: 30         # 7 is the AWS minimum
  key_usage: "ENCRYPT_DECRYPT"
  customer_master_key_spec: "SYMMETRIC_DEFAULT"
  multi_region: false
  key_administrators: ["arn:aws:iam::111122223333:role/platform-admin"]
  key_users:          ["arn:aws:iam::111122223333:role/dev-infra-ecs-task"]
  policy: null                        # raw JSON overrides everything above

  # Additional upstream arguments — 27 keys, grouped by concern.
  # All commented out: the value shown is the upstream default that applies
  # when the key is absent. Uncomment to change one.

  # create
  # create: true
  # create_external: false
  # create_replica: false
  # create_replica_external: false

  # enable
  # enable_default_policy: true
  # enable_route53_dnssec: false

  # key
  # key_asymmetric_public_encryption_users: []
  # key_asymmetric_sign_verify_users: []
  # key_hmac_users: []
  # key_material_base64: null
  # key_owners: []
  # key_service_roles_for_autoscaling: []
  # key_service_users: []
  # key_statements: {}
  # key_symmetric_encryption_users: []

  # primary
  # primary_external_key_arn: null
  # primary_key_arn: null

  # other
  # aliases_use_name_prefix: false
  # bypass_policy_lockout_safety_check: null
  # computed_aliases: {}
  # custom_key_store_id: null
  # grants: {}
  # is_enabled: null
  # override_policy_documents: []
  # route53_dnssec_sources: []
  # source_policy_documents: []
  # valid_to: null

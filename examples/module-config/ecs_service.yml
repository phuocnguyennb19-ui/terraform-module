# ecs_service — config reference
# Read by modules/ecs_service/locals.tf. Every key below appears in that file; anything
# you omit falls back to the module's own default.
#
# `enabled` is read by the ROOT and becomes a count gate.
#
# Block is `service` (legacy `ecs_service`). `autoscaling` is a separate
# block at the YAML root, read by the same module — both live in this file.
#
# PRECEDENCE — task_definition, container_definitions and volumes may be written
# under `service:` or at the YAML root, and they do NOT resolve the same way:
#   task_definition        root overrides nested   (merge(nested, root))
#   container_definitions  nested wins, root is the fallback
#   volumes                nested wins, root is the fallback
# cpu/memory fall back service.task_definition.cpu -> service.cpu -> 256.
#
# Used as an overlay in directory mode:
#   terraform plan -var="config_dir=examples/module-config"
# or paste this block into a monolithic config.yml.

service:                                         # legacy key: ecs_service
  enabled: false
  desired_count: 3
  health_check_path: "/healthz"
  health_check_matcher: "200"
  health_check_grace_period: 30
  priority: 100                                  # ALB listener rule priority
  host_header: "api.dev.platform.example.com"
  deployment_maximum_percent: 200
  deployment_minimum_healthy_percent: 100
  deployment_controller_type: "ECS"
  enable_execute_command: false                  # true in dev for debugging
  force_new_deployment: false
  propagate_tags: "SERVICE"
  platform_version: "LATEST"
  scheduling_strategy: "REPLICA"
  wait_for_steady_state: true                    # prod: apply blocks until healthy
  assign_public_ip: false
  capacity_provider_strategy: []
  load_balancer:
    container_name: "app"
    container_port: 8080
  task_definition:
    family: "dev-infra-task"
    network_mode: "awsvpc"
    requires_compatibilities: ["FARGATE"]
    cpu: 512
    memory: 1024
    execution_role_arn: null                     # null = the cluster's role
    task_role_arn: null
  container_definitions:
    - name: "app"
      image: "111122223333.dkr.ecr.ap-southeast-1.amazonaws.com/core-backend-api:1.4.2"
      essential: true
      cpu: 512
      memory: 1024
      command: []
      port_mappings:
        - { container_port: 8080, protocol: "tcp" }
      environment:                               # map, converted to name/value pairs
        LOG_LEVEL: "info"
        APP_ENV: "dev"
      secrets:                                   # map of NAME -> ARN, never a value
        DB_PASSWORD: "arn:aws:secretsmanager:ap-southeast-1:111122223333:secret:db-abc"
      mount_points: []
      depends_on: []
  volumes: []

autoscaling:                                     # its own block at the YAML root
  enabled: false
  min_capacity: 3
  max_capacity: 12
  target_cpu_utilization: 60                     # 0 disables the CPU policy
  target_memory_utilization: 70                  # 0 disables the memory policy
